name: 周复盘
description: 每周同步学习进度、阻塞和下周计划
title: "Week XX 复盘："
labels:
  - weekly-review
body:
  - type: input
    id: week
    attributes:
      label: 周数
      description: 例如 Week 01
      placeholder: Week 01
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: 日期范围
      placeholder: 2026-05-04 至 2026-05-10
    validations:
      required: true
  - type: input
    id: hours
    attributes:
      label: 实际学习时间
      placeholder: 例如 26h
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: 本周产出
      description: 代码、notebook、笔记、实验结果、README、demo 等
      placeholder: |
        - 
        - 
        - 
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: 最大阻塞
      placeholder: 本周最卡的地方是什么？
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: 下周计划
      placeholder: 下周最重要的 3 件事
    validations:
      required: true

